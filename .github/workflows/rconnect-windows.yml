# RConnect — Windows x64 portable exe (role: destek) + macOS arm64 dmg (role: yonetici),
# trimmed from upstream RustDesk 1.5.3 flutter-build.yml.
# Output: RConnect-Destek-<version>.exe and RConnect-Yonetici-<version>-arm64.dmg (+ .sha256) as workflow
# artifacts. The role is baked in at compile time via RCONNECT_ROL (see src/common.rs). Android destek APK (universal arm64+armv7) is release-signed (fails without secrets); the support exe embeds an optional salted-hash fixed password from secrets.
name: RConnect Windows x64 + macOS arm64

on:
  workflow_dispatch:
  push:
    branches: [rconnect]
    paths-ignore: ["**.md"]

permissions:
  contents: read

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  # macOS arm64 only (as upstream): 3.24.5's engine crashes in attributedSubstringForProposedRange.
  FLUTTER_MACOS_ARM_VERSION: "3.44.9"
  BRIDGE_FLUTTER_VERSION_344: "3.44.8"
  MAC_RUST_VERSION: "1.81" # cidre requires 1.81 on macOS
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  LLVM_VERSION: "15.0.6"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # same vcpkg commit as upstream 1.5.3 (keeps vcpkg.json baseline valid)
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.3"

jobs:
  generate-bridge:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ca-certificates clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bridge
      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true
      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd
      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  build-topmost-window:
    runs-on: windows-2022
    steps:
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
      - name: Build RustDeskTempTopMostWindow (x64)
        run: |
          git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow RustDeskTempTopMostWindow
          cd RustDeskTempTopMostWindow
          git checkout ecd8d6a139eee76845ea66423fb739af450fda90
          msbuild WindowInjection/WindowInjection.vcxproj -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: topmostwindow-x64
          path: RustDeskTempTopMostWindow/WindowInjection/x64/Release/WindowInjection.dll

  build-windows:
    needs: [generate-bridge, build-topmost-window]
    runs-on: windows-2022
    env:
      TARGET: x86_64-pc-windows-msvc
      VCPKG_TRIPLET: x64-windows-static
      RCONNECT_ROL: destek
      # Fixed support password (salted hash from rconnect-tools/preset-password.py). Empty if the
      # secrets are not set -> src/common.rs skips it and the exe builds without a fixed password.
      RCONNECT_PRESET_PASSWORD: ${{ secrets.RCONNECT_PRESET_PASSWORD }}
      RCONNECT_PRESET_SALT: ${{ secrets.RCONNECT_PRESET_SALT }}
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Check fixed-password secrets
        shell: bash
        run: |
          if [ -z "$RCONNECT_PRESET_PASSWORD" ] || [ -z "$RCONNECT_PRESET_SALT" ]; then
            echo "::warning::RCONNECT_PRESET_PASSWORD/RCONNECT_PRESET_SALT secret not set; building WITHOUT a fixed password"
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ env.TARGET }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ env.VCPKG_TRIPLET }}
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet ${{ env.VCPKG_TRIPLET }} --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi

      - name: Build RConnect (flutter, portable)
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          # virtual display driver (same as upstream)
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      - name: find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res")
          if [ "$runner_res" != "" ]; then cp $runner_res ./libs/portable/Runner.res; fi

      - name: Download RustDeskTempTopMostWindow
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-x64
          path: "./rustdesk"

      - name: Build self-extracting portable exe
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./out
          OUT="RConnect-Destek-${{ env.VERSION }}.exe"
          mv ./target/release/rustdesk-portable-packer.exe "./out/$OUT"
          (cd out && sha256sum "$OUT" | tee "$OUT.sha256")
          ls -l out

      - name: Upload exe + SHA256
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RConnect-Destek-${{ env.VERSION }}-windows-x64
          path: ./out
          if-no-files-found: error

  # Bridge for the macOS arm64 build: must be generated with the same Flutter (3.44) / patched sources.
  generate-bridge-flutter-344:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ca-certificates clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bridge-344
      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION_344 }}
          cache: true
      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          bash .github/patches/apply_flutter_3.44_source_patches.sh
          pushd flutter && flutter pub get && popd
      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-artifact-flutter-3.44
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  # Administrator (outgoing-only) client for Apple Silicon. Unsigned, not notarized.
  build-macos-arm64:
    needs: [generate-bridge-flutter-344]
    runs-on: macos-15
    env:
      TARGET: aarch64-apple-darwin
      VCPKG_TRIPLET: arm64-osx
      RCONNECT_ROL: yonetici
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install build runtime
        run: |
          brew install llvm create-dmg nasm
          if command -v pkg-config &>/dev/null; then echo "pkg-config already installed"; else brew install pkg-config; fi

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_MACOS_ARM_VERSION }}

      - name: Keep CocoaPods for Flutter 3.44
        run: flutter config --no-enable-swift-package-manager

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          # https://github.com/flutter/flutter/issues/133533
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Patch RConnect sources for Flutter 3.44
        shell: bash
        run: |
          brew install gnu-sed
          export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          bash .github/patches/apply_flutter_3.44_source_patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ env.TARGET }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: macos-14-arm64

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact-flutter-3.44
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi

      - name: Build RConnect (flutter, macOS arm64)
        run: |
          MIN_MACOS_VERSION="12.3"
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
          sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
          sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          echo "MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}" >> "$GITHUB_ENV"
          export MACOSX_DEPLOYMENT_TARGET="${MIN_MACOS_VERSION}"
          # Finder/Dock name "RConnect Yönetici" (xcconfig default is plain RConnect; forwarded to xcodebuild)
          export FLUTTER_XCODE_RCONNECT_DISPLAY_NAME="RConnect Yönetici"
          ./build.py --flutter --hwcodec --unix-file-copy-paste --screencapturekit

      - name: Create unsigned dmg + SHA256
        run: |
          CREATE_DMG="$(readlink -f "$(command -v create-dmg)")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          mkdir -p out
          OUT="RConnect-Yonetici-${{ env.VERSION }}-arm64.dmg"
          create-dmg --volname "RConnect Yönetici" --icon "RConnect.app" 200 190 --hide-extension "RConnect.app" --window-size 800 400 --app-drop-link 600 185 "out/$OUT" ./flutter/build/macos/Build/Products/Release/RConnect.app
          (cd out && shasum -a 256 "$OUT" | tee "$OUT.sha256")
          ls -l out

      - name: Upload dmg + SHA256
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RConnect-Yonetici-${{ env.VERSION }}-macos-arm64
          path: ./out
          if-no-files-found: error

  # ---- Android support client (role: destek): one signed universal APK (arm64-v8a + armeabi-v7a) ----
  # Fails (never publishes an unsigned APK) when the signing secrets are missing.
  check-android-secrets:
    runs-on: ubuntu-24.04
    env:
      ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
      ANDROID_ALIAS: ${{ secrets.ANDROID_ALIAS }}
      ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Require Android signing secrets
        shell: bash
        run: |
          missing=0
          for v in ANDROID_SIGNING_KEY ANDROID_ALIAS ANDROID_KEY_STORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::secret $v is not set; refusing to build an unsigned APK"; missing=1; fi
          done
          exit $missing

  build-android-lib:
    needs: [generate-bridge, check-android-secrets]
    name: build librustdesk.so ${{ matrix.job.target }}
    runs-on: ubuntu-24.04
    env:
      CARGO_NDK_VERSION: "3.1.2"
      NDK_VERSION: "r28c"
      ANDROID_FLUTTER_VERSION: "3.24.5"
      RCONNECT_ROL: destek
      # Read by rustc option_env! at compile time, so they must be in the environment of the
      # cargo-ndk step below (job-level env covers it). Empty -> no fixed password (src/common.rs).
      RCONNECT_PRESET_PASSWORD: ${{ secrets.RCONNECT_PRESET_PASSWORD }}
      RCONNECT_PRESET_SALT: ${{ secrets.RCONNECT_PRESET_SALT }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: aarch64-linux-android, abi: arm64-v8a, ndk_script: ndk_arm64.sh }
          - { target: armv7-linux-androideabi, abi: armeabi-v7a, ndk_script: ndk_arm.sh }
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Check fixed-password secrets
        shell: bash
        run: |
          if [ -z "$RCONNECT_PRESET_PASSWORD" ] || [ -z "$RCONNECT_PRESET_SALT" ]; then
            echo "::warning::RCONNECT_PRESET_PASSWORD/RCONNECT_PRESET_SALT secret not set; building WITHOUT a fixed password"
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl gcc-multilib git g++ g++-multilib libayatana-appindicator3-dev libasound2-dev libc6-dev libclang-dev libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev libpulse-dev libva-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev libxfixes-dev llvm-dev nasm ninja-build openjdk-17-jdk-headless pkg-config tree wget

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! ./flutter/build_android_deps.sh "${{ matrix.job.abi }}"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rconnect-android-lib
          key: ${{ matrix.job.target }}

      - name: Build librustdesk.so (cargo ndk)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add ${{ matrix.job.target }}
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/${{ matrix.job.ndk_script }}

      - name: Upload librustdesk.so
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rconnect-librustdesk.so.${{ matrix.job.target }}
          path: ./target/${{ matrix.job.target }}/release/liblibrustdesk.so
          if-no-files-found: error

  build-android-apk:
    needs: [generate-bridge, build-android-lib]
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: "r28c"
      ANDROID_FLUTTER_VERSION: "3.24.5"
      RCONNECT_ROL: destek
      ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
    steps:
      - name: Require Android signing secrets
        shell: bash
        env:
          ANDROID_ALIAS: ${{ secrets.ANDROID_ALIAS }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for v in ANDROID_SIGNING_KEY ANDROID_ALIAS ANDROID_KEY_STORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::secret $v is not set; refusing to build an unsigned APK"; missing=1; fi
          done
          exit $missing

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl git g++ libclang-dev llvm-dev ninja-build openjdk-17-jdk-headless pkg-config wget

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{ env.ANDROID_FLUTTER_VERSION }} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      # gradle runs `cargo metadata` (rustls-platform-verifier) so a Rust toolchain must exist
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Download librustdesk.so (arm64-v8a)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rconnect-librustdesk.so.aarch64-linux-android
          path: ./flutter/android/app/src/main/jniLibs/arm64-v8a

      - name: Download librustdesk.so (armeabi-v7a)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rconnect-librustdesk.so.armv7-linux-androideabi
          path: ./flutter/android/app/src/main/jniLibs/armeabi-v7a

      - name: Build universal APK
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          # build with the debug config; the APK is re-signed with the release key below
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          JNI=./flutter/android/app/src/main/jniLibs
          SYSROOT="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib"
          mv $JNI/arm64-v8a/liblibrustdesk.so $JNI/arm64-v8a/librustdesk.so
          cp "$SYSROOT/aarch64-linux-android/libc++_shared.so" $JNI/arm64-v8a/
          mv $JNI/armeabi-v7a/liblibrustdesk.so $JNI/armeabi-v7a/librustdesk.so
          cp "$SYSROOT/arm-linux-androideabi/libc++_shared.so" $JNI/armeabi-v7a/
          pushd flutter
          flutter build apk --release --target-platform android-arm64,android-arm
          popd
          mkdir -p signed-apk
          mv ./flutter/build/app/outputs/flutter-apk/app-release.apk signed-apk/RConnect-Destek-${{ env.VERSION }}.apk

      # https://github.com/r0adkll/sign-android-release/issues/84#issuecomment-1889636075
      - name: Setup sign tool version variable
        shell: bash
        run: |
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "ANDROID_SIGN_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV
          echo "ANDROID_BUILD_TOOLS_DIR=/usr/local/lib/android/sdk/build-tools/$BUILD_TOOL_VERSION" >> $GITHUB_ENV
          echo Last build tool version is: $BUILD_TOOL_VERSION

      - uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407 # v1
        name: Sign app APK
        id: sign-rconnect
        with:
          releaseDirectory: ./signed-apk
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          # env.ANDROID_SIGN_TOOL_VERSION is set by Step "Setup sign tool version variable"
          BUILD_TOOLS_VERSION: ${{ env.ANDROID_SIGN_TOOL_VERSION }}

      - name: Verify signature, package + SHA256
        shell: bash
        run: |
          set -euo pipefail
          SIGNED="${{ steps.sign-rconnect.outputs.signedReleaseFile }}"
          test -f "$SIGNED"
          APKSIGNER="$ANDROID_BUILD_TOOLS_DIR/apksigner"
          "$APKSIGNER" verify --verbose "$SIGNED"
          if "$APKSIGNER" verify --print-certs "$SIGNED" | grep -qi "Android Debug"; then
            echo "::error::APK is signed with the debug key"; exit 1
          fi
          # applicationId + app label + ABIs
          "$ANDROID_BUILD_TOOLS_DIR/aapt2" dump badging "$SIGNED" | grep -E "^package: name='com.rcandan.rconnect.destek'" 
          "$ANDROID_BUILD_TOOLS_DIR/aapt2" dump badging "$SIGNED" | grep -E "^application-label:'RConnect'"
          unzip -l "$SIGNED" | grep -E "lib/(arm64-v8a|armeabi-v7a)/librustdesk.so"
          mkdir -p out
          cp "$SIGNED" "out/RConnect-Destek-${{ env.VERSION }}.apk"
          (cd out && sha256sum "RConnect-Destek-${{ env.VERSION }}.apk" | tee "RConnect-Destek-${{ env.VERSION }}.apk.sha256")
          ls -l out

      - name: Upload apk + SHA256
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RConnect-Destek-${{ env.VERSION }}-android
          path: ./out
          if-no-files-found: error

  # Support (incoming-only) client for macOS, one job per CPU: Apple Silicon (macos-15) + Intel (macos-15-intel).
  # Bundle RConnectDestek.app / com.rcandan.rconnect.destek / display "RConnect Destek" (see build.py
  # rconnect_macos_brand); APP_NAME is RConnectDestek on macOS+destek (libs/hbb_common DEFAULT_APP_NAME).
  # Same toolchain split as the admin job / upstream: arm64 = Flutter 3.44 + patched sources, x64 = Flutter 3.24.5.
  # Unsigned, not notarized.
  build-macos-destek:
    needs: [generate-bridge, generate-bridge-flutter-344]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: macos-15, arch: arm64, target: aarch64-apple-darwin, vcpkg-triplet: arm64-osx, extra-build-args: "--screencapturekit" }
          - { os: macos-15-intel, arch: x64, target: x86_64-apple-darwin, vcpkg-triplet: x64-osx, extra-build-args: "" }
    env:
      RCONNECT_ROL: destek
      # Same fixed support password secrets as the Windows exe (empty -> built without a fixed password).
      RCONNECT_PRESET_PASSWORD: ${{ secrets.RCONNECT_PRESET_PASSWORD }}
      RCONNECT_PRESET_SALT: ${{ secrets.RCONNECT_PRESET_SALT }}
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Check fixed-password secrets
        shell: bash
        run: |
          if [ -z "$RCONNECT_PRESET_PASSWORD" ] || [ -z "$RCONNECT_PRESET_SALT" ]; then
            echo "::warning::RCONNECT_PRESET_PASSWORD/RCONNECT_PRESET_SALT secret not set; building WITHOUT a fixed password"
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install build runtime
        run: |
          brew install llvm create-dmg
          if command -v pkg-config &>/dev/null; then echo "pkg-config already installed"; else brew install pkg-config; fi

      - name: Install NASM
        run: |
          if [ "${{ matrix.job.arch }}" = "x64" ]; then
            # NASM 2.16.x as upstream (brew's 3.x is CLI-incompatible; aom needs 2.x on x86_64).
            wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
            unzip nasm-2.16.03-macosx.zip
            sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          else
            brew install nasm # as the admin job (89c44ed)
          fi
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ matrix.job.arch == 'arm64' && env.FLUTTER_MACOS_ARM_VERSION || env.FLUTTER_VERSION }}

      - name: Keep CocoaPods for Flutter 3.44 (arm64)
        if: ${{ matrix.job.arch == 'arm64' }}
        run: flutter config --no-enable-swift-package-manager

      - name: Patch flutter (x64, Flutter 3.24.5)
        # Flutter 3.44 (arm64) already has this dropdown fix.
        if: ${{ matrix.job.arch == 'x64' }}
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          # https://github.com/flutter/flutter/issues/133533
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Patch RConnect sources for Flutter 3.44 (arm64)
        if: ${{ matrix.job.arch == 'arm64' }}
        shell: bash
        run: |
          brew install gnu-sed
          export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          bash .github/patches/apply_flutter_3.44_source_patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: macos-destek-${{ matrix.job.arch }}

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # arm64's *.freezed.dart must match the freezed resolved under Flutter 3.44.
          name: ${{ matrix.job.arch == 'arm64' && 'bridge-artifact-flutter-3.44' || 'bridge-artifact' }}
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi

      - name: Build RConnect Destek (flutter, macOS ${{ matrix.job.arch }})
        run: |
          if [ "${{ matrix.job.arch }}" = "arm64" ]; then
            MIN_MACOS_VERSION="12.3"
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
            sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
            sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
            echo "MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}" >> "$GITHUB_ENV"
            export MACOSX_DEPLOYMENT_TARGET="${MIN_MACOS_VERSION}"
          fi
          # build.py (rconnect_macos_brand) renames the bundle to RConnectDestek.app for RCONNECT_ROL=destek
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}

      - name: Create unsigned dmg + SHA256
        run: |
          CREATE_DMG="$(readlink -f "$(command -v create-dmg)")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          mkdir -p out
          OUT="RConnect-Destek-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg"
          create-dmg --volname "RConnect Destek" --icon "RConnectDestek.app" 200 190 --hide-extension "RConnectDestek.app" --window-size 800 400 --app-drop-link 600 185 "out/$OUT" ./flutter/build/macos/Build/Products/Release/RConnectDestek.app
          (cd out && shasum -a 256 "$OUT" | tee "$OUT.sha256")
          ls -l out

      - name: Upload dmg + SHA256
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RConnect-Destek-${{ env.VERSION }}-macos-${{ matrix.job.arch }}
          path: ./out
          if-no-files-found: error
